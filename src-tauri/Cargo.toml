[package]
name = "coding-agent-hud"
version = "0.1.0"
description = "Windows Coding Agent telemetry HUD"
edition = "2021"
rust-version = "1.85"
default-run = "coding-agent-hud"

[lib]
name = "coding_agent_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coding-agent-hud"
path = "src/main.rs"

[[bin]]
name = "agent-hud-hook"
path = "src/bin/agent-hud-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
